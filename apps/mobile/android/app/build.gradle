plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.google.gms.google-services'
}

// TURN relay settings live in apps/mobile/android/turn.properties (git-ignored). See turn.properties.example
def turnProps = new Properties()
def turnFile = rootProject.file('turn.properties')
if (turnFile.exists()) {
    turnFile.withInputStream { turnProps.load(it) }
}
def turnValue = { String key -> (turnProps.getProperty(key, '') ?: '').trim().replace('\\', '\\\\').replace('"', '\\"') }

android {
    namespace 'com.vhn.connectx'
    compileSdk 34

    defaultConfig {
        applicationId "com.vhn.connectx"
        minSdk 26
        targetSdk 34
        versionCode 21
        versionName "1.0.20"
        buildConfigField "String", "TURN_URLS", "\"${turnValue('turn.urls')}\""
        buildConfigField "String", "TURN_USERNAME", "\"${turnValue('turn.username')}\""
        buildConfigField "String", "TURN_CREDENTIAL", "\"${turnValue('turn.credential')}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'

    // Firebase BOM & Auth & Messaging & Cloud Firestore
    implementation platform('com.google.firebase:firebase-bom:33.0.0')
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-messaging-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.google.android.gms:play-services-auth:21.1.0'

    // Networking & Realtime WebSockets
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // WebRTC Media Engine for Realtime Audio, Video & Screen Sharing (1.3.10 fixes nativeCreateDecoder UnsatisfiedLinkError)
    implementation 'io.getstream:stream-webrtc-android:1.3.10'
}

