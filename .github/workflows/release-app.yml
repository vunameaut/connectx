name: ConnectX Build & Release Pipeline

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Phiên bản cập nhật (ví dụ: 1.0.1)'
        required: false
        default: '1.0.1'
      release_notes:
        description: 'Nội dung cập nhật (Release Notes)'
        required: false
        default: 'Cập nhật Zalo/Messenger ConnectX: Tối ưu gọi điện WebRTC & Chia sẻ màn hình Android 14+'

permissions:
  contents: write

jobs:
  test-and-verify:
    name: 🧪 Run Automated Tests Across Monorepo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared types
        run: npm --prefix packages/shared-types run build

      - name: Run all workspace tests (47 tests)
        run: npm test

  build-and-release-apk:
    name: 📱 Build & Publish Android APK
    needs: test-and-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Gradle Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('apps/mobile/android/**/*.gradle*', 'apps/mobile/android/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Restore Firebase google-services.json
        run: |
          mkdir -p apps/mobile/android/app
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > apps/mobile/android/app/google-services.json
          elif [ -f "services/api/secrets/google-services.json" ]; then
            cp services/api/secrets/google-services.json apps/mobile/android/app/google-services.json
          fi

      - name: Determine Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
            TAG="v${VERSION}"
          else
            VERSION="1.0.0-${GITHUB_SHA::7}"
            TAG="v1.0.0"
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "TAG=${TAG}" >> $GITHUB_OUTPUT

      - name: Make Gradle Wrapper Executable
        run: chmod +x apps/mobile/android/gradlew

      - name: Assemble Android APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK & Version Metadata Artifacts
        run: |
          mkdir -p release-artifacts
          cp apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk release-artifacts/ConnectX-${{ steps.get_version.outputs.TAG }}.apk
          
          # Generate version.json for In-App Auto-Update checker (Mandatory Update)
          cat <<EOF > release-artifacts/version.json
          {
            "versionName": "${{ steps.get_version.outputs.VERSION }}",
            "tagName": "${{ steps.get_version.outputs.TAG }}",
            "commit": "${{ github.sha }}",
            "apkFileName": "ConnectX-${{ steps.get_version.outputs.TAG }}.apk",
            "forceUpdate": true,
            "minSupportedVersion": "${{ steps.get_version.outputs.VERSION }}",
            "releaseNotes": "${{ github.event.inputs.release_notes || 'Cập nhật bắt buộc: Nâng cấp tính năng và bảo mật ConnectX' }}",
            "downloadUrl": "https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.TAG }}/ConnectX-${{ steps.get_version.outputs.TAG }}.apk",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF

      - name: Upload APK Artifact to GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: ConnectX-${{ steps.get_version.outputs.TAG }}
          path: release-artifacts/ConnectX-${{ steps.get_version.outputs.TAG }}.apk
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: ConnectX ${{ steps.get_version.outputs.TAG }}
          body: |
            ## 🚀 ConnectX Release ${{ steps.get_version.outputs.TAG }}

            ${{ github.event.inputs.release_notes || 'Bản phát hành tự động qua GitHub Actions CI/CD.' }}

            ### 📦 Tải về và cài đặt:
            - **APK Download:** [ConnectX-${{ steps.get_version.outputs.TAG }}.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.get_version.outputs.TAG }}/ConnectX-${{ steps.get_version.outputs.TAG }}.apk)
            
            ### ✨ Tính năng nổi bật:
            - 🔑 **Đăng ký / Đăng nhập Google** (`play-services-auth` & Firebase Auth).
            - 💬 **Nhắn tin real-time** (Tin nhắn 1:1, nhóm, đính kèm).
            - 👥 **Danh bạ & Kết bạn** (Tìm kiếm qua email, kết bạn nhanh).
            - 📞 **Gọi thoại & Gọi Video** (WebRTC P2P + Coturn / Metered TURN relay).
            - 🖥️ **Chia sẻ toàn bộ màn hình** (Android 14+ `mediaProjection` Foreground Service + `FLAG_SECURE`).
            - 🔄 **Cập nhật tự động (In-App OTA Auto-Update)** qua GitHub Releases.
          files: |
            release-artifacts/ConnectX-${{ steps.get_version.outputs.TAG }}.apk
            release-artifacts/version.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
